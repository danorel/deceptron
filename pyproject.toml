[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deceptron"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic==0.40.0",
    "openai>=1.40.0",
    "python-dotenv==1.0.1",
    "pydantic==2.9.2",
    "requests==2.32.3",
    "PyGithub==2.4.0",
    "docker==7.1.0",
    "scikit-learn==1.5.2",
    "dagster==1.13.8",
    "dagster-webserver==1.13.8",
]

# Phase 2 SFT only — install on the GPU box: `uv sync --extra sft`
# torch needs the CUDA wheel index; see README.
[project.optional-dependencies]
sft = [
    "torch",
    "transformers==4.45.2",
    "peft==0.13.0",
    "trl==0.11.4",
    "accelerate==0.34.2",
    "bitsandbytes==0.44.1",
    "datasets==3.0.1",
]

[tool.setuptools.packages.find]
where = ["src"]
